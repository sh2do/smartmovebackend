databases:
  - name: smartmove-db
    plan: free
    databaseName: smartmove
    user: smartmove

services:
  - type: web
    name: smartmove-backend
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartmove-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: GUNICORN_WORKERS
        value: "2"
      - key: MPESA_BASE_URL
        value: "https://sandbox.safaricom.co.ke" # Placeholder - REPLACE WITH ACTUAL VALUE
      - key: MPESA_CONSUMER_KEY
        value: "your_mpesa_consumer_key" # Placeholder - REPLACE WITH ACTUAL VALUE
      - key: MPESA_CONSUMER_SECRET
        value: "your_mpesa_consumer_secret" # Placeholder - REPLACE WITH ACTUAL VALUE
      - key: MPESA_SHORTCODE
        value: "600980" # Placeholder - REPLACE WITH ACTUAL VALUE
      - key: MPESA_PASSKEY
        value: "your_mpesa_passkey" # Placeholder - REPLACE WITH ACTUAL VALUE
      - key: CALLBACK_URL
        value: "https://your-backend.onrender.com/api/payments/callback" # Placeholder - REPLACE WITH ACTUAL URL
      - key: GOOGLE_MAPS_API_KEY
        value: "your_google_maps_api_key" # Placeholder - REPLACE WITH ACTUAL VALUE
